services:
  postgres:
    image: postgres:16-alpine
    container_name: tele-follow-up-demo-postgres
    environment:
      POSTGRES_DB: tele_follow_up_demo
      POSTGRES_USER: teleflow_demo
      POSTGRES_PASSWORD: LocalDemoDb2026!
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - tele_follow_up_demo_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teleflow_demo -d tele_follow_up_demo"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  tele_follow_up_demo_data:
